<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!--
      Set visual viewport size for mobile devices to the device size,
      which results in a scale of 1 and a 1:1 mapping between CSS pixels
      and Qt device independent pixels.
    -->
    <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0"/>

    <title>AOWIS Controller</title>

    <style>
      html,
      body {
        padding: 0;
        margin: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }

      #screen {
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }

      #screen canvas {
        outline: none;
      }

      #qtspinner {
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        overflow: auto;
        box-sizing: border-box;
        margin: 0;
        padding: 24px;
        background: #ffffff;
      }

      #qtspinner .aowis-splash {
        width: min(320px, calc(100vw - 48px));
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
        color: #111111;
      }

      #qtspinner .aowis-splash-logo {
        display: block;
        width: 100%;
        height: auto;
      }

      #qtspinner .aowis-splash-line {
        display: flex;
        justify-content: center;
        width: 100%;
        overflow: visible;
        white-space: nowrap;
      }

      #qtspinner .aowis-splash-line > span {
        display: inline-block;
        flex: none;
        transform-origin: center top;
        white-space: nowrap;
      }

      #qtspinner .aowis-splash-title {
        margin-top: 12px;
        font-size: 64px;
        font-weight: 700;
        line-height: 1;
      }

      #qtspinner .aowis-splash-subtitle {
        margin-top: 8px;
        font-size: 18px;
        font-weight: 500;
        line-height: 1.2;
      }

      #qtstatus {
        width: 100%;
        min-height: 1.4em;
        max-height: min(220px, 30vh);
        box-sizing: border-box;
        margin-top: 18px;
        overflow: auto;
        color: #333333;
        font: 14px/1.4 Arial, Helvetica, sans-serif;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      #qtstatus[data-kind="error"] {
        padding: 10px 12px;
        border: 1px solid #b3261e;
        border-radius: 4px;
        background: #fff4f2;
        color: #8c1d18;
        text-align: left;
      }

      #qtspinner noscript {
        display: block;
        margin-top: 18px;
        color: #8c1d18;
        font: 14px/1.4 Arial, Helvetica, sans-serif;
      }
    </style>
  </head>

  <body onload="init()">
    <figure id="qtspinner">
      <div class="aowis-splash">
        <img class="aowis-splash-logo" src="aowis.png" alt="AOWIS">
        <div class="aowis-splash-line aowis-splash-title">
          <span data-fit-splash-width>AOWIS</span>
        </div>
        <div class="aowis-splash-line aowis-splash-subtitle">
          <span data-fit-splash-width>Afritic Open Water Infrastructure Standard</span>
        </div>
        <div id="qtstatus" role="status" aria-live="polite" aria-atomic="true"></div>
        <noscript>JavaScript is disabled. Please enable JavaScript to use this application.</noscript>
      </div>
    </figure>

    <div id="screen" tabindex="0"></div>

    <script type="text/javascript">
      let qtFocusHandlersInstalled = false;
      let qtFocusRetryTimer = null;

      function isAowisFullscreen()
      {
          return document.fullscreenElement !== null;
      }

      async function toggleAowisFullscreen()
      {
          try {
              if (isAowisFullscreen()) {
                  await document.exitFullscreen();
              } else {
                  await document.documentElement.requestFullscreen();
              }
          } catch (error) {
              console.error('Unable to change fullscreen state:', error);
          }
      }

      function isNativeTextInput(element)
      {
          if (!element)
              return false;

          const tag = element.tagName;

          return tag === 'INPUT'
              || tag === 'TEXTAREA'
              || tag === 'SELECT'
              || element.isContentEditable;
      }

      function getQtShadowFocusTarget()
      {
          const shadowContainer = document.getElementById('qt-shadow-container');

          if (!shadowContainer)
              return null;

          const shadowRoot = shadowContainer.shadowRoot;

          if (!shadowRoot)
              return null;

          let target = shadowRoot.querySelector('.hidden-visually-read-by-screen-reader');

          if (target)
              return target;

          target = shadowRoot.querySelector('button');

          if (target)
              return target;

          target = shadowRoot.querySelector('[tabindex]');

          if (target)
              return target;

          return null;
      }

      function getQtFallbackFocusTarget()
      {
          const screen = document.querySelector('#screen');

          if (!screen)
              return null;

          const canvas = screen.querySelector('canvas');

          if (canvas)
              return canvas;

          return screen;
      }

      function getQtKeyboardFocusTarget()
      {
          const shadowTarget = getQtShadowFocusTarget();

          if (shadowTarget)
              return shadowTarget;

          return getQtFallbackFocusTarget();
      }

      function focusQtWasmKeyboardTarget(reason)
      {
          const active = document.activeElement;

          if (isNativeTextInput(active)) {
              console.log('Qt focus skipped; native text input active:', active);
              return false;
          }

          const target = getQtKeyboardFocusTarget();

          if (!target) {
              console.log('Qt focus target not found. Reason:', reason);
              return false;
          }

          if (!target.hasAttribute('tabindex'))
              target.setAttribute('tabindex', '0');

          try {
              target.focus({ preventScroll: true });
          } catch (error) {
              target.focus();
          }

          console.log(
              'Qt focus set. Reason:',
              reason,
              'target:',
              target,
              'document.activeElement:',
              document.activeElement
          );

          return true;
      }

      function focusQtWasmKeyboardTargetSoon(reason)
      {
          setTimeout(function () {
              focusQtWasmKeyboardTarget(reason);
          }, 0);
      }

      function startQtFocusRetry()
      {
          if (qtFocusRetryTimer !== null)
              return;

          let attempts = 0;

          qtFocusRetryTimer = setInterval(function () {
              attempts++;

              if (focusQtWasmKeyboardTarget('startup retry ' + attempts) || attempts > 30) {
                  clearInterval(qtFocusRetryTimer);
                  qtFocusRetryTimer = null;
              }
          }, 100);
      }

      function installQtFocusHandling()
      {
          if (qtFocusHandlersInstalled)
              return;

          qtFocusHandlersInstalled = true;

          const screen = document.querySelector('#screen');

          if (screen)
              screen.setAttribute('tabindex', '0');

          document.addEventListener('pointerdown', function () {
              focusQtWasmKeyboardTargetSoon('pointerdown');
          }, true);

          document.addEventListener('mousedown', function () {
              focusQtWasmKeyboardTargetSoon('mousedown');
          }, true);

          document.addEventListener('mouseup', function () {
              focusQtWasmKeyboardTargetSoon('mouseup');
          }, true);

          document.addEventListener('touchstart', function () {
              focusQtWasmKeyboardTargetSoon('touchstart');
          }, true);

          document.addEventListener('contextmenu', function (event) {
              event.preventDefault();
              focusQtWasmKeyboardTargetSoon('contextmenu');
          }, true);

          document.addEventListener('focusout', function (event) {
              console.log(
                  'DOM focusout:',
                  'from:', event.target,
                  'to:', event.relatedTarget,
                  'active:', document.activeElement
              );

              if (event.relatedTarget === null)
                  focusQtWasmKeyboardTargetSoon('focusout-null');
          }, true);

          window.addEventListener('focus', function () {
              focusQtWasmKeyboardTargetSoon('window-focus');
          });

          document.addEventListener('keydown', function (event) {
              if (event.key === 'F11') {
                  event.preventDefault();
                  event.stopImmediatePropagation();
                  toggleAowisFullscreen();
                  return;
              }

              console.log(
                  'DOM keydown:',
                  event.key,
                  'activeElement:',
                  document.activeElement
              );
          }, true);

          startQtFocusRetry();
      }

      function fitAowisSplashText()
      {
          const splash = document.querySelector('#qtspinner .aowis-splash');
          if (!splash)
              return;

          const targetWidth = splash.getBoundingClientRect().width;
          if (targetWidth <= 0)
              return;

          splash.querySelectorAll('[data-fit-splash-width]').forEach((text) =>
          {
              text.style.transform = 'none';
              const textWidth = text.getBoundingClientRect().width;
              if (textWidth > 0)
                  text.style.transform = `scaleX(${targetWidth / textWidth})`;
          });
      }

      function setQtStatus(message, kind = 'status')
      {
          const status = document.querySelector('#qtstatus');
          if (!status)
              return;

          status.textContent = message;
          status.dataset.kind = kind;
          status.setAttribute('role', kind === 'error' ? 'alert' : 'status');
          status.setAttribute('aria-live', kind === 'error' ? 'assertive' : 'polite');
      }

      function formatQtStartupError(error)
      {
          if (error instanceof Error) {
              if (error.stack && error.stack !== error.message)
                  return `${error.message}\n\n${error.stack}`;

              return error.message;
          }

          return String(error);
      }

      function parseAowisIni(text)
      {
          const values = {};
          let section = '';

          String(text).replace(/^\uFEFF/, '').split(/\r?\n/).forEach((line) =>
          {
              const trimmed = line.trim();
              if (!trimmed || trimmed.startsWith(';') || trimmed.startsWith('#'))
                  return;

              if (trimmed.startsWith('[') && trimmed.endsWith(']')) {
                  section = trimmed.slice(1, -1).trim().toLowerCase();
                  return;
              }

              const separator = trimmed.indexOf('=');
              if (separator < 0)
                  return;

              const key = trimmed.slice(0, separator).trim().toLowerCase();
              const value = trimmed.slice(separator + 1).trim();
              values[`${section}/${key}`] = value;
          });

          return values;
      }

      function parseAowisBoolean(value, defaultValue)
      {
          if (typeof value !== 'string' || value.trim().length === 0)
              return defaultValue;

          switch (value.trim().toLowerCase()) {
          case '1':
          case 'true':
          case 'yes':
          case 'on':
              return true;
          case '0':
          case 'false':
          case 'no':
          case 'off':
              return false;
          default:
              return defaultValue;
          }
      }

      async function loadAowisConfiguration()
      {
          const configurationUrl = new URL('/aowis-server-gui.ini', window.location.origin);
          configurationUrl.searchParams.set('aowis-config-revision', Date.now().toString());

          const response = await fetch(configurationUrl, {
              cache: 'no-store',
              credentials: 'same-origin'
          });
          if (!response.ok)
              throw new Error(`Unable to load ${configurationUrl.pathname}: HTTP ${response.status} ${response.statusText}`);

          const values = parseAowisIni(await response.text());
          const configuredWasmRenderer = (values['gui/map_wasm_renderer'] || 'rhi')
              .trim().toLowerCase();
          const mapWasmRenderer = configuredWasmRenderer === 'browser'
              ? 'browser'
              : 'rhi';
          if (configuredWasmRenderer !== 'rhi' && configuredWasmRenderer !== 'browser')
              console.warn(`Invalid gui/map_wasm_renderer '${configuredWasmRenderer}', using rhi`);

          const guiConfiguration = Object.freeze({
              examplesBuiltinEnable: parseAowisBoolean(
                  values['gui/examples_builtin_enable'], true),
              mapWasmRenderer
          });
          const baseUrl = (values['map_server/base_url'] || '').trim().replace(/\/+$/, '');
          if (!baseUrl)
              throw new Error(`${configurationUrl.pathname} does not contain a non-empty map_server/base_url setting`);

          const configuration = Object.freeze({
              baseUrl,
              apiKey: (values['map_server/api_key'] || '').trim(),
              deleteApiKey: (values['map_server/delete_api_key'] || '').trim()
          });

          if (typeof window.aowisSetMapServerConfiguration !== 'function')
              throw new Error('Browser map configuration receiver is unavailable');

          window.aowisGuiConfiguration = guiConfiguration;
          window.aowisMapServerConfiguration = configuration;
          window.aowisSetMapServerConfiguration(configuration);

          console.info('Loaded and activated AOWIS configuration:', {
              configurationUrl: configurationUrl.toString(),
              examplesBuiltinEnable: guiConfiguration.examplesBuiltinEnable,
              mapWasmRenderer: guiConfiguration.mapWasmRenderer,
              baseUrl,
              hasApiKey: configuration.apiKey.length > 0,
              hasDeleteApiKey: configuration.deleteApiKey.length > 0
          });
      }

      async function init()
      {
          const spinner = document.querySelector('#qtspinner');
          const screen = document.querySelector('#screen');
          const splashLogo = document.querySelector('.aowis-splash-logo');

          if (splashLogo)
              splashLogo.addEventListener('load', fitAowisSplashText, { once: true });
          window.addEventListener('resize', fitAowisSplashText);
          fitAowisSplashText();

          const showUi = (ui) => {
              [spinner, screen].forEach(element => element.style.display = 'none');

              if (screen === ui)
                  screen.style.position = 'relative';

              ui.style.display = ui === spinner ? 'flex' : 'block';
          };

          try {
              showUi(spinner);

              if (!window.crossOriginIsolated || typeof SharedArrayBuffer === 'undefined') {
                  throw new Error(
                      'This AOWIS WebAssembly build requires cross-origin isolation for worker threads. '
                      + 'Serve it over HTTPS (or localhost) with '
                      + 'Cross-Origin-Opener-Policy: same-origin and '
                      + 'Cross-Origin-Embedder-Policy: require-corp.'
                  );
              }

              setQtStatus('Loading configuration...');
              await loadAowisConfiguration();
              setQtStatus('Loading application...');

              const instance = await qtLoad({
                  qt: {
                      onLoaded: () =>
                      {
                          showUi(screen);
                          installQtFocusHandling();

                          requestAnimationFrame(() =>
                          {
                              focusQtWasmKeyboardTarget('onLoaded requestAnimationFrame');
                          });

                          startQtFocusRetry();
                      },

                      onExit: exitData =>
                      {
                          let exitMessage = 'Application exit';

                          if (exitData.code !== undefined)
                              exitMessage += ` with code ${exitData.code}`;

                          if (exitData.text !== undefined)
                              exitMessage += ` (${exitData.text})`;

                          setQtStatus(exitMessage, exitData.code ? 'error' : 'status');
                          showUi(spinner);
                      },

                      entryFunction: window.aowis_server_gui_entry,
                      containerElements: [screen],
                  }
              });
          } catch (error) {
              console.error(error);
              console.error(error?.stack);
              setQtStatus(
                  `Application failed to start.\n\n${formatQtStartupError(error)}`,
                  'error');
              showUi(spinner);
          }
      }
    </script>

    <script src="aowis-browser-map.js?v=__AOWIS_MAP_JS_VERSION__"></script>
    <script src="aowis-browser-vector.js?v=__AOWIS_VECTOR_JS_VERSION__"></script>
    <script src="aowis-browser-network-webgl.js?v=__AOWIS_NETWORK_JS_VERSION__"></script>
    <script src="aowis-browser-network.js?v=__AOWIS_NETWORK_JS_VERSION__"></script>
    <script src="aowis-browser-map-editor.js?v=__AOWIS_EDITOR_JS_VERSION__"></script>
    <script src="aowis-server-gui.js"></script>
    <script type="text/javascript" src="qtloader.js"></script>
  </body>
</html>
